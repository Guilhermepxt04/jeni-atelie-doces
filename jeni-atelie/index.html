<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jeni Ateliê | Doces finos por encomenda</title>
    <meta name="description" content="Brigadeiros, bem-casados, bolos e caixas de presente feitos à mão pela Jeni, na semana da sua festa. Monte sua caixa e encomende pelo WhatsApp." />
    <meta name="theme-color" content="#2e1c16" />
    <meta name="color-scheme" content="light" />
    <!-- domínio de exemplo: troque por o domínio real antes de publicar (aqui, no robots.txt e no sitemap.xml) -->
    <link rel="canonical" href="https://jeniatelie.com.br/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Jeni Ateliê" />
    <meta property="og:url" content="https://jeniatelie.com.br/" />
    <meta property="og:title" content="Jeni Ateliê | Doces finos por encomenda" />
    <meta property="og:description" content="Brigadeiros, bem-casados, bolos e caixas de presente feitos à mão, na semana da sua festa." />
    <meta property="og:image" content="https://jeniatelie.com.br/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Selo do Jeni Ateliê ao lado de uma xícara de framboesas" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Bakery",
      "name": "Jeni Ateliê",
      "description": "Confeitaria artesanal por encomenda: docinhos finos, bem-casados, bolos e caixas de presente.",
      "url": "https://jeniatelie.com.br/",
      "image": "https://jeniatelie.com.br/og-image.jpg",
      "telephone": "+5511999999999",
      "email": "contato@jeniatelie.com.br",
      "priceRange": "R$ 22 – R$ 290",
      "servesCuisine": "Confeitaria",
      "address": { "@type": "PostalAddress", "addressLocality": "São Paulo", "addressRegion": "SP", "addressCountry": "BR" },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "09:00", "closes": "18:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "13:00" }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!-- sem JavaScript as entradas animadas nunca rodam: mostra tudo já no lugar -->
      <style>#root [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }</style>
      <p>Encomendas pelo WhatsApp (11) 99999-9999 ou pelo e-mail <a href="mailto:contato@jeniatelie.com.br">contato@jeniatelie.com.br</a>.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      VLibras (tradução para Libras) e menu de acessibilidade (Sienna, versão fixa)
      carregam só depois da página, para não atrasar a primeira pintura. Mesmo padrão da Eleva Tech.
    -->
    <script>
      window.addEventListener('load', function () {
        var vlibras = document.createElement('script');
        vlibras.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
        vlibras.onload = function () { new window.VLibras.Widget('https://vlibras.gov.br/app'); };
        document.body.appendChild(vlibras);

        var menu = document.createElement('script');
        menu.src = 'https://cdn.jsdelivr.net/npm/sienna-accessibility@2.2.333/dist/sienna-accessibility.umd.js';
        menu.setAttribute('data-asw-lang', 'pt');
        menu.setAttribute('data-asw-position', 'bottom-left');
        document.body.appendChild(menu);
      });
    </script>
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
    </div>
  </body>
</html>
