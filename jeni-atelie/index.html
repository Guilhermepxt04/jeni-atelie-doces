<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jeni Ateliê | Bolo de pote e doces na Vila Cosmopolita e Tatuapé</title>
    <meta name="description" content="Bolos de pote, fatias, coxinhas de morango, brownies e bolos inteiros sob encomenda. Pronta-entrega e entrega grátis na Vila Cosmopolita e no Tatuapé. Peça pelo WhatsApp." />
    <meta name="theme-color" content="#FFF4EC" />
    <meta name="color-scheme" content="light" />
    <!-- sem domínio ainda: quando houver, volte com <link rel="canonical"> e og:url com o endereço completo (ver src/seo.ts) -->

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Jeni Ateliê" />
    <meta property="og:title" content="Jeni Ateliê | Bolo de pote e doces na Vila Cosmopolita e Tatuapé" />
    <meta property="og:description" content="Bolos de pote, fatias, coxinhas de morango e brownies feitos pela Jeni. Entrega grátis na Vila Cosmopolita e no Tatuapé." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bolo de pote, coxinhas de morango, pudim e brownies do Jeni Ateliê" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- JSON-LD gerado de src/seo.ts no build (scripts/prerender.js) -->
    <!--json-ld-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!-- sem JavaScript as entradas animadas nunca rodam: mostra tudo já no lugar -->
      <style>#root [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }</style>
      <p>Pedidos pelo WhatsApp (11) 99999-9999 ou pelo e-mail <a href="mailto:contato@jeniatelie.com.br">contato@jeniatelie.com.br</a>.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      VLibras (tradução para Libras) e menu de acessibilidade (Sienna, versão fixa)
      carregam só depois da página, para não atrasar a primeira pintura. Mesmo padrão da Eleva Tech.
    -->
    <script>
      window.addEventListener('load', function () {
        var vlibras = document.createElement('script');
        vlibras.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
        vlibras.onload = function () { new window.VLibras.Widget('https://vlibras.gov.br/app'); };
        document.body.appendChild(vlibras);

        var menu = document.createElement('script');
        menu.src = 'https://cdn.jsdelivr.net/npm/sienna-accessibility@2.2.333/dist/sienna-accessibility.umd.js';
        menu.setAttribute('data-asw-lang', 'pt');
        menu.setAttribute('data-asw-position', 'bottom-left');
        document.body.appendChild(menu);
      });
    </script>
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
    </div>
  </body>
</html>
